<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your bag — NABATI ORIGINALS</title>
  <meta name="description" content="Review your selection. NABATI ORIGINALS." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="page-cart">
  <div class="texture" aria-hidden="true"></div>

  <header class="masthead">
    <a href="index.html" class="masthead-logo" aria-label="NABATI ORIGINALS">
      <span class="masthead-logo-text on">
        <span class="masthead-word">NABATI</span>
        <span class="masthead-word masthead-word-sub">ORIGINALS</span>
      </span>
    </a>
    <nav class="masthead-nav" aria-label="Primary">
      <a href="collection.html">Shop All</a>
      <a href="collection.html#featured">Best Sellers</a>
      <a href="bespoke.html">Bespoke</a>
      <a href="index.html#contact">Contact</a>
      <a href="cart.html" class="masthead-cart masthead-nav-current" aria-label="Cart">
        <span class="masthead-cart-icon" aria-hidden="true"></span>
        <span class="masthead-cart-count" id="masthead-cart-count">0</span>
      </a>
    </nav>
  </header>

  <main class="cart-main">
    <div class="cart-inner">
      <h1 class="cart-title">Your bag</h1>
      <p class="cart-intro">Review your items, update quantity if needed, then proceed to checkout.</p>

      <div class="cart-content" id="cart-content">
        <div class="cart-empty" id="cart-empty">
          <p class="cart-empty-text">Your bag is empty.</p>
          <a href="collection.html" class="cart-empty-cta">Shop the collection</a>
        </div>
        <div class="cart-items" id="cart-items" hidden>
          <div class="cart-items-list" id="cart-items-list"></div>
          <div class="cart-summary">
            <p class="cart-subtotal"><span class="cart-total-label">Subtotal</span> <span class="cart-total-amount" id="cart-total"></span></p>
            <a href="#" class="cart-checkout-btn" id="cart-checkout-btn">Proceed to Checkout</a>
            <a href="collection.html" class="cart-continue">Continue shopping</a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="foot">
    <div class="foot-inner">
      <span class="foot-logo">NABATI ORIGINALS</span>
      <nav class="foot-nav" aria-label="Footer">
        <a href="collection.html">Collection</a>
        <a href="bespoke.html">Bespoke</a>
        <a href="index.html#contact">Contact</a>
      </nav>
      <span class="foot-copy">&copy; NABATI ORIGINALS</span>
    </div>
  </footer>

  <script src="cart-store.js"></script>
  <script>
    (function() {
      var DATA = {
        'dunes-of-gold': { name: 'Dunes of Gold', price: 340, imgClass: 'collection-item-img--1' },
        'sacred-smoke': { name: 'Sacred Smoke', price: 360, imgClass: 'collection-item-img--2' },
        'midnight-oasis': { name: 'Midnight Oasis', price: 340, imgClass: 'collection-item-img--3' }
      };
      var m = /id=([^&]+)/.exec(window.location.search || '');
      if (m && DATA[m[1]] && window.NabatiCart) {
        window.NabatiCart.addItem(m[1], 1);
        window.history.replaceState({}, '', 'cart.html');
      }

      function render() {
        var cart = window.NabatiCart ? window.NabatiCart.getCart() : [];
        var emptyEl = document.getElementById('cart-empty');
        var itemsEl = document.getElementById('cart-items');
        var listEl = document.getElementById('cart-items-list');
        var totalEl = document.getElementById('cart-total');
        var checkoutBtn = document.getElementById('cart-checkout-btn');
        var countEl = document.getElementById('masthead-cart-count');

        if (countEl) countEl.textContent = window.NabatiCart ? window.NabatiCart.getCount() : 0;

        if (!cart.length) {
          emptyEl.hidden = false;
          itemsEl.hidden = true;
          return;
        }
        emptyEl.hidden = true;
        itemsEl.hidden = false;

        var total = 0;
        var firstId = null;
        listEl.innerHTML = cart.map(function(line) {
          var p = DATA[line.id];
          if (!p) return '';
          var lineTotal = p.price * line.qty;
          total += lineTotal;
          if (!firstId) firstId = line.id;
          return '<div class="cart-item" data-id="' + line.id + '">' +
            '<div class="cart-item-visual"><div class="cart-item-img ' + p.imgClass + '"></div></div>' +
            '<div class="cart-item-details">' +
              '<h2 class="cart-item-name">' + p.name + '</h2>' +
              '<p class="cart-item-meta">50 ml · Eau de Parfum</p>' +
              '<div class="cart-item-qty">' +
                '<button type="button" class="cart-qty-btn" aria-label="Decrease" data-id="' + line.id + '" data-delta="-1">−</button>' +
                '<span class="cart-qty-num">' + line.qty + '</span>' +
                '<button type="button" class="cart-qty-btn" aria-label="Increase" data-id="' + line.id + '" data-delta="1">+</button>' +
              '</div>' +
              '<p class="cart-item-subtotal">$' + lineTotal + '</p>' +
            '</div>' +
          '</div>';
        }).join('');

        if (totalEl) totalEl.textContent = '$' + total;
        if (checkoutBtn) checkoutBtn.href = 'checkout.html';

        listEl.querySelectorAll('.cart-qty-btn').forEach(function(btn) {
          btn.addEventListener('click', function() {
            var id = btn.getAttribute('data-id');
            var delta = parseInt(btn.getAttribute('data-delta'), 10);
            var line = cart.find(function(x) { return x.id === id; });
            if (!line) return;
            window.NabatiCart.setItemQty(id, line.qty + delta);
            render();
          });
        });
      }

      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', render);
      else render();
    })();
  </script>
  <script src="script.js"></script>
</body>
</html>
