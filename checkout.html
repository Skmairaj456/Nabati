<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout — NABATI ORIGINALS</title>
  <meta name="description" content="Complete your order. Secure checkout." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="page-checkout">
  <div class="texture" aria-hidden="true"></div>

  <header class="checkout-header">
    <a href="index.html" class="checkout-logo">NABATI ORIGINALS</a>
    <h1 class="checkout-title">Checkout</h1>
    <p class="checkout-steps">Your details · Delivery · Payment</p>
    <a href="cart.html" class="checkout-back">Back to bag</a>
  </header>

  <section class="checkout-order-summary" aria-label="Order summary">
    <div class="checkout-order-inner">
      <h2 class="checkout-summary-heading">Order summary</h2>
      <div class="checkout-summary-lines" id="checkout-summary-lines">
        <div class="checkout-summary-line" id="checkout-summary-line">
          <span class="checkout-summary-name" id="checkout-summary-name">1 fragrance</span>
          <span class="checkout-summary-meta" id="checkout-summary-meta">50 ml</span>
        </div>
      </div>
      <p class="checkout-summary-total"><span class="checkout-summary-total-label">Total</span> <span class="checkout-summary-total-amount" id="checkout-summary-total">$340</span></p>
    </div>
  </section>

  <div class="checkout-form-wrap">
    <p class="checkout-secure-label">Secure checkout</p>
    <form class="checkout-form" action="#" method="post" id="checkout-form">
      <fieldset class="checkout-section">
        <legend class="checkout-section-legend">Your details</legend>
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required autocomplete="name" />

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email" />
      </fieldset>

      <fieldset class="checkout-section">
        <legend class="checkout-section-legend">Delivery</legend>
        <label for="address">Address</label>
        <input type="text" id="address" name="address" required autocomplete="street-address" />

        <div class="row">
          <div>
            <label for="city">City</label>
            <input type="text" id="city" name="city" required autocomplete="address-level2" />
          </div>
          <div>
            <label for="postal">Postal code</label>
            <input type="text" id="postal" name="postal" required autocomplete="postal-code" />
          </div>
        </div>

        <label for="country">Country</label>
        <input type="text" id="country" name="country" required autocomplete="country-name" />
      </fieldset>

      <fieldset class="checkout-section">
        <legend class="checkout-section-legend">Payment</legend>
        <label for="card">Card number</label>
        <input type="text" id="card" name="card" required inputmode="numeric" autocomplete="cc-number" />

        <div class="row">
          <div>
            <label for="expiry">Expiry</label>
            <input type="text" id="expiry" name="expiry" required placeholder="MM / YY" autocomplete="cc-exp" />
          </div>
          <div>
            <label for="cvc">CVC</label>
            <input type="text" id="cvc" name="cvc" required inputmode="numeric" autocomplete="cc-csc" />
          </div>
        </div>
      </fieldset>

      <button type="submit" class="checkout-submit">Complete order</button>

      <div class="checkout-trust" aria-label="Security">
        <p class="checkout-trust-line"><span class="checkout-trust-icon" aria-hidden="true">🔒</span> Secure checkout. We do not store card details.</p>
      </div>
    </form>
  </div>

  <script src="cart-store.js"></script>
  <script>
    (function() {
      var data = {
        'dunes-of-gold': { name: 'Dunes of Gold', price: 340 },
        'sacred-smoke': { name: 'Sacred Smoke', price: 360 },
        'midnight-oasis': { name: 'Midnight Oasis', price: 340 }
      };
      var linesEl = document.getElementById('checkout-summary-lines');
      var totalEl = document.getElementById('checkout-summary-total');
      var cart = window.NabatiCart ? window.NabatiCart.getCart() : [];
      var m = /id=([^&]+)/.exec(window.location.search || '');
      var fallbackId = m && data[m[1]] ? m[1] : 'dunes-of-gold';

      if (cart.length && linesEl && totalEl) {
        var total = 0;
        linesEl.innerHTML = cart.map(function(line) {
          var p = data[line.id];
          if (!p) return '';
          total += p.price * line.qty;
          return '<div class="checkout-summary-line"><span class="checkout-summary-name">' + p.name + (line.qty > 1 ? ' × ' + line.qty : '') + '</span><span class="checkout-summary-meta">50 ml</span></div>';
        }).join('');
        totalEl.textContent = '$' + total;
      } else {
        var nameEl = document.getElementById('checkout-summary-name');
        var metaEl = document.getElementById('checkout-summary-meta');
        if (nameEl && data[fallbackId]) nameEl.textContent = data[fallbackId].name;
        if (metaEl) metaEl.textContent = '50 ml';
        if (totalEl && data[fallbackId]) totalEl.textContent = '$' + data[fallbackId].price;
      }
    })();
    document.getElementById('checkout-form').addEventListener('submit', function(e) {
      e.preventDefault();
      var btn = this.querySelector('.checkout-submit');
      btn.textContent = 'Thank you';
      btn.disabled = true;
    });
  </script>
</body>
</html>
